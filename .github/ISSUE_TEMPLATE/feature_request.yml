name: Feature Request
description: 提一个新功能或改进建议
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么场景？
      description: 描述你在硬件设计 / DIY 项目中遇到的具体问题
      placeholder: 例如：画完原理图后还要手动去记哪些元件没封装…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望插件怎么做？
      placeholder: 例如：增加一个「封装检查清单」，能扫描原理图并列出缺少封装的元件
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你还考虑过哪些方案？
  - type: checkboxes
    id: willingness
    attributes:
      label: 你愿意自己实现这个功能吗？
      options:
        - label: 我可以提 PR 实现
        - label: 我希望维护者来实现
